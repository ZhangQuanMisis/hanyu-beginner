<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>汉语大闯关 · 第一至四课</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#667eea 0%,#764ba2 100%);
    min-height:100vh; color:#333;
    display:flex; justify-content:center;
  }
  #app { width:100%; max-width:480px; min-height:100vh; display:flex; flex-direction:column; position:relative; }
  .screen { flex:1; display:flex; flex-direction:column; padding:20px 18px 30px; animation:fadeIn .35s ease; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }
  .card {
    background:#fff; border-radius:22px; padding:24px 20px;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
  }
  .center { justify-content:center; align-items:center; text-align:center; }

  /* ===== 首页 ===== */
  .logo { margin-bottom:8px; }
  .logo img { display:block; width:132px; height:132px; border-radius:50%; object-fit:cover;
    background:#fffdf6; box-shadow:0 10px 24px rgba(60,30,90,.28), 0 0 0 5px rgba(255,255,255,.6);
    transform:scale(1.16); }
  h1.title { color:#fff; font-size:34px; letter-spacing:4px; margin-bottom:6px; text-shadow:0 3px 10px rgba(0,0,0,.25); }
  .subtitle { color:#fff; font-size:14px; margin-bottom:22px; line-height:1.7; text-shadow:0 1px 3px rgba(0,0,0,.25); }
  .btn {
    display:block; width:100%; border:none; border-radius:16px;
    padding:16px; font-size:19px; font-weight:600; cursor:pointer;
    transition:transform .12s, box-shadow .12s; margin-top:12px;
  }
  .btn:active { transform:scale(.96); }
  .btn-main { background:linear-gradient(135deg,#ff9a44,#fc6076); color:#fff; box-shadow:0 6px 18px rgba(252,96,118,.4); line-height:1.3; }
  .btn-main .ru2 { display:block; font-size:12.5px; font-weight:500; opacity:.94; margin-top:3px; letter-spacing:.2px; }
  .btn-sub { background:rgba(255,255,255,.95); color:#5b3fa8; border:none; font-size:15px; padding:13px; font-weight:700; }
  .rules { background:rgba(255,255,255,.16); border-radius:16px; padding:14px 16px; margin-top:20px; color:#fff; font-size:13.5px; line-height:1.75; text-align:left; width:100%; max-width:100%; box-sizing:border-box; }
  .rules b { color:#ffe27a; }
  .rules .r-zh { margin-top:9px; }
  .rules .ru { display:block; font-size:12.5px; color:#ffe9c9; line-height:1.5; opacity:.95; word-break:break-word; }

  /* ===== 顶部状态栏 ===== */
  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; color:#fff; }
  .hearts { font-size:20px; letter-spacing:2px; }
  .hearts .lost { opacity:.28; filter:grayscale(1); }
  .score { font-size:17px; font-weight:700; background:rgba(255,255,255,.95); color:#5b3fa8; padding:5px 14px; border-radius:20px; }
  .lvl-tag { font-size:13px; background:rgba(0,0,0,.22); padding:5px 12px; border-radius:20px; margin-bottom:14px; color:#fff; align-self:flex-start; font-weight:600; }
  .quit { background:none; border:none; color:#fff; font-size:20px; cursor:pointer; padding:4px 8px; }

  .progress { height:8px; background:rgba(255,255,255,.28); border-radius:6px; overflow:hidden; margin-bottom:16px; }
  .progress .bar { height:100%; background:linear-gradient(90deg,#ffe27a,#ffb347); border-radius:6px; transition:width .4s ease; }

  /* ===== 题目 ===== */
  .qnum { color:#fff; font-size:13px; font-weight:600; margin-bottom:8px; letter-spacing:.5px; }
  .qtext { font-size:22px; font-weight:700; line-height:1.55; margin-bottom:6px; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.22); }
  .qsub {
    font-size:14.5px; color:#fff8ec; line-height:1.65; margin-bottom:18px;
    background:rgba(0,0,0,.22); padding:9px 12px; border-radius:12px;
    border-left:4px solid #ffe27a; text-shadow:0 1px 2px rgba(0,0,0,.25);
  }
  .combo { display:inline-block; background:linear-gradient(135deg,#ff9a44,#fc6076); color:#fff; font-size:12px; font-weight:700; padding:3px 10px; border-radius:12px; margin-bottom:10px; animation:pop .3s; }
  @keyframes pop { 0%{transform:scale(.5);} 70%{transform:scale(1.15);} 100%{transform:scale(1);} }

  .opt {
    display:block; width:100%; text-align:left; background:#fff;
    border:2px solid #eee; border-radius:14px; padding:14px 16px;
    font-size:18px; cursor:pointer; margin-bottom:11px; transition:all .15s; line-height:1.45;
    font-family:inherit; color:#2b2b38;
  }
  .opt:active { transform:scale(.98); }
  .opt.correct { background:#e6f9ee; border-color:#34c77b; color:#1d8a54; font-weight:700; }
  .opt.wrong { background:#feecec; border-color:#f26d6d; color:#c0392b; }
  .opt.dim { opacity:.42; }

  /* 组句题 */
  .answer-slot {
    min-height:58px; background:#fff; border:2px dashed #c9b6f0; border-radius:14px;
    padding:10px; margin-bottom:14px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  }
  .answer-slot .word { background:#7c5cd6; color:#fff; border-color:#7c5cd6; }
  .tile-pool { display:flex; flex-wrap:wrap; gap:9px; }
  .word {
    background:#fff; border:2px solid #d9cdf5; color:#5b3fa8;
    font-size:17px; padding:9px 14px; border-radius:11px; cursor:pointer; transition:all .12s;
  }
  .word:active { transform:scale(.94); }
  .word.used { opacity:.22; pointer-events:none; }

  .feedback {
    border-radius:14px; padding:13px 15px; font-size:14.5px; line-height:1.75; margin-top:4px;
    animation:fadeIn .3s;
  }
  .feedback.good { background:#e6f9ee; color:#1d8a54; }
  .feedback.bad { background:#feecec; color:#c0392b; }

  .btn-next { background:linear-gradient(135deg,#7c5cd6,#5b8def); color:#fff; margin-top:14px; }

  /* ===== 结果 ===== */
  .big-emoji { font-size:70px; margin-bottom:10px; }
  .stars { font-size:38px; letter-spacing:6px; margin:10px 0 4px; }
  .stars .off { opacity:.22; filter:grayscale(1); }
  .result-title { font-size:24px; font-weight:800; margin-bottom:6px; }
  .result-sub { color:#777; font-size:14.5px; line-height:1.7; margin-bottom:8px; }
  .stat-row { display:flex; gap:10px; margin:16px 0; }
  .stat-box { flex:1; background:#f6f6fb; border-radius:14px; padding:12px 6px; }
  .stat-num { font-size:22px; font-weight:800; color:#7c5cd6; }
  .stat-label { font-size:12px; color:#999; margin-top:3px; }

  .level-list { width:100%; margin-top:6px; }
  .level-item {
    display:flex; align-items:center; background:#fff; border-radius:14px;
    padding:13px 14px; margin-bottom:10px; cursor:pointer; transition:transform .12s;
  }
  .level-item:active { transform:scale(.97); }
  .level-item.locked { opacity:.55; }
  .level-item .li-emoji { font-size:26px; margin-right:12px; }
  .level-item .li-name { flex:1; text-align:left; }
  .level-item .li-name b { font-size:16.5px; display:block; }
  .level-item .li-name span { font-size:12px; color:#8d88a8; }
  .level-item .li-stars { font-size:14px; letter-spacing:1px; }

  /* 证书 */
  .cert-img { width:100%; border-radius:18px; box-shadow:0 12px 30px rgba(0,0,0,.3); display:block; background:#fffdf7; }
  .cert {
    background:linear-gradient(150deg,#fffdf5,#fff6e3);
    border:3px solid #e8c46a; border-radius:20px; padding:26px 18px; text-align:center; margin:14px 0;
    box-shadow:0 8px 24px rgba(232,196,106,.35);
  }
  .cert .c-title { font-size:20px; font-weight:800; color:#a67c1b; letter-spacing:2px; }
  .cert .c-name { font-size:26px; font-weight:800; color:#7c5cd6; margin:10px 0 4px; border-bottom:2px dashed #e8c46a; display:inline-block; padding:0 18px 4px; }
  .cert .c-detail { font-size:13px; color:#9a7f33; line-height:1.85; margin-top:8px; }
  .name-input {
    width:100%; border:2px solid #e3e0f0; border-radius:12px; padding:12px 14px;
    font-size:17px; text-align:center; margin-top:14px; font-family:inherit;
  }
  .name-input:focus { outline:none; border-color:#7c5cd6; }

  .toast {
    position:fixed; left:50%; bottom:9%; transform:translateX(-50%);
    background:rgba(0,0,0,.84); color:#fff; font-size:14.5px;
    padding:11px 22px; border-radius:24px; z-index:99; white-space:nowrap;
    animation:fadeIn .25s; max-width:88vw;
  }
  .shake { animation:shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-9px);} 40%{transform:translateX(9px);} 60%{transform:translateX(-6px);} 80%{transform:translateX(6px);} }
  .listen-btn {
    background:linear-gradient(135deg,#34c77b,#28a86a); color:#fff; border:none; border-radius:30px;
    font-size:16px; font-weight:700; padding:11px 26px; margin-bottom:16px; cursor:pointer; font-family:inherit;
  }
  .listen-btn:active { transform:scale(.95); }
</style>
</head>

/* ===== 音效 ===== */
let AC=null;
function beep(freq,dur,type,vol){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.value=freq; g.gain.value=vol||0.12;
    o.connect(g); g.connect(AC.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
    o.stop(AC.currentTime+dur);
  }catch(e){}
}
const sGood=()=>{beep(660,.12);setTimeout(()=>beep(880,.18),110);};
const sBad =()=>{beep(220,.25,'sawtooth',.09);};
const sStar=()=>{beep(523,.1);setTimeout(()=>beep(659,.1),100);setTimeout(()=>beep(784,.2),200);};

/* ===== 语音 ===== */
function speak(text){
  try{
    if(!window.speechSynthesis) return false;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='zh-CN'; u.rate=0.85;
    const v = speechSynthesis.getVoices().find(v=>v.lang && v.lang.indexOf('zh')===0);
    if(v) u.voice=v;
    speechSynthesis.speak(u); return true;
  }catch(e){ return false; }
}

function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),1800);
}

    const starStr = st>0 ? '⭐'.repeat(st)+'<span class="off" style="opacity:.2">⭐'.repeat(3-st)+'</span>' : (unlocked?'<span style="font-size:12px;color:#8d88a8">去挑战 →</span>':'🔒');
    items += `<div class="level-item${lock}" onclick="${unlocked?`levelIntro(${i})`:`toast('先通过上一关才能解锁 🔒')`}">
      <div class="li-emoji">${unlocked?l.emoji:'🔒'}</div>
      <div class="li-name"><b>${l.name}</b><span>${l.ru} · ${l.qs.length}题</span></div>
      <div class="li-stars">${starStr}</div>
    </div>`;
    if(st>0) unlocked=true; else unlocked=false;
  });
  $app.innerHTML = `
  <div class="screen">
    <div class="topbar">
      <button class="quit" onclick="home()">←</button>
      <span style="font-weight:800;font-size:19px">📜 关卡列表</span>
      <span style="width:28px"></span>
    </div>
    <div class="level-list">${items}</div>
  </div>`;
}

function levelIntro(i){
  const l = LEVELS[i];
  const st = S.stars[i]||0;
  $app.innerHTML = `
  <div class="screen center">
    <div style="font-size:64px;margin-bottom:8px">${l.emoji}</div>
    <h1 class="title" style="font-size:26px;letter-spacing:1px">${l.name}</h1>
    <div class="subtitle">${l.ru}<br>共 ${l.qs.length} 题 · 3 ❤️ · ${st>0 ? '最佳成绩：'+'⭐'.repeat(st) : '还没有通关记录'}</div>
    <div style="width:100%;max-width:320px">
      <button class="btn btn-main" onclick="startLevel(${i})">${st>0?'🔁 再闯一次':'▶ 开始挑战'}<span class="ru2">${st>0?'Пройти ещё раз':'Начать'}</span></button>
      <button class="btn btn-sub" onclick="home()">← 返回首页 · На главную</button>
    </div>
    <div class="rules" style="margin-top:22px">
      ⭐ 3星：全对　⭐ 2星：错1–2题　⭐ 1星：错3题以上<br>
      答<u>对</u>加分 + 🔥连击，答<u>错</u>扣 ❤️ 并看解析
    </div>
  </div>`;
}

function startLevel(i){
  S = Object.assign(S, {level:i, qi:0, hearts:3, combo:0, correct:0, wrong:0, answered:false});
  S.levelScore = 0;
  renderQ();
}

function topbar(){
  return `<div class="topbar">
    <button class="quit" onclick="confirmQuit()">✕</button>
    <div class="hearts">${'❤️'.repeat(S.hearts)}<span class="lost">${'❤️'.repeat(Math.max(0,3-S.hearts))}</span></div>
    <div class="score">${S.score}分</div>
  </div>`;
}
function confirmQuit(){
  if(confirm('确定要退出吗？本关进度将丢失 / Выйти?')) home();
}

function renderQ(){
  const l = LEVELS[S.level], q = l.qs[S.qi];
  S.answered=false; S.orderSel=[];
  const comboHtml = S.combo>=2 ? `<div class="combo">🔥 连击 x${S.combo}！</div>` : '';
  let body='';
  if(q.type==='order'){
    const shuffled = shuffle(q.words.slice());
    body = `
      <div class="answer-slot" id="slot"></div>
      <div class="tile-pool" id="pool">${shuffled.map((w)=>`<span class="word" onclick="tapWord(this)">${w}</span>`).join('')}</div>
      <div id="fb"></div>
      <button class="btn btn-next" id="checkBtn" onclick="checkOrder()">✅ 检查答案</button>`;
  } else {
    // 每次出题都重新打乱选项顺序，正确答案位置随机
    S.optOrder = shuffle(q.opts.map((_,i)=>i));
    const listen = q.type==='listen'
      ? `<button class="listen-btn" onclick="listenTap()">🔊 播放发音</button><div id="listenFallback" style="font-size:13px;color:#fff8ec;margin:-10px 0 14px;opacity:.85"></div>`
      : '';
    body = `${listen}
      <div id="opts">${S.optOrder.map((orig,disp)=>
        `<button class="opt" onclick="pickOpt(this,${disp})">${q.opts[orig]}</button>`).join('')}</div>
      <div id="fb"></div>`;
  }
  $app.innerHTML = `
  <div class="screen">
    ${topbar()}
    <div class="progress"><div class="bar" style="width:${(S.qi/l.qs.length)*100}%"></div></div>
    <div class="lvl-tag">${l.emoji} ${l.name}</div>
    <div class="qnum">第 ${S.qi+1} 题 / 共 ${l.qs.length} 题</div>
    ${comboHtml}
    <div class="qtext">${q.q}</div>
    ${q.sub?`<div class="qsub">${q.sub}</div>`:''}
    ${body}
  </div>`;
  if(q.type==='listen'){
    setTimeout(()=>{ const ok=speak(q.speak); if(!ok) document.getElementById('listenFallback').textContent=`（设备不支持语音，答案拼音：${q.py}）`; },400);
  }
}
function listenTap(){
  const q = LEVELS[S.level].qs[S.qi];
  const ok = speak(q.speak);
  if(!ok) toast('设备不支持语音，参考拼音：'+q.py);
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

function tapWord(el){
  if(S.answered) return;
  const w = el.textContent;
  el.classList.add('used');
  const chip = document.createElement('span');
  chip.className='word'; chip.textContent=w; chip.dataset.src=el;
  chip.onclick=()=>{ if(S.answered) return; el.classList.remove('used'); chip.remove(); };
  document.getElementById('slot').appendChild(chip);
}

function checkOrder(){
  if(S.answered) return;
  const chips=[...document.querySelectorAll('#slot .word')].map(c=>c.textContent).join('');
  if(!chips){ toast('先点击下方词语组句 👇'); return; }
  const q = LEVELS[S.level].qs[S.qi];
  const accepted = [q.a].concat(q.alts||[]);
  const ok = accepted.includes(chips);
  resolve(ok, null, chips);
}

function pickOpt(el, disp){
  if(S.answered) return;
  const orig = S.optOrder[disp];
  const q = LEVELS[S.level].qs[S.qi];
  const ok = orig===q.a;
  resolve(ok, el, orig);
}

function resolve(ok, el, data){
  const q = LEVELS[S.level].qs[S.qi];
  S.answered=true;
  const fb = document.getElementById('fb');
  if(ok){
    S.combo++; S.correct++;
    const gained = 10 + Math.min(10,(S.combo-1)*2);
    S.score += gained; S.levelScore += gained;
    sGood();
    if(el){ el.classList.add('correct'); document.querySelectorAll('.opt').forEach(o=>{ if(o!==el) o.classList.add('dim'); }); }
    fb.innerHTML = `<div class="feedback good">✅ <b>答对啦！Отлично!</b> +${gained}分 ${S.combo>=2?`（🔥连击x${S.combo}）`:''}<br>${q.ex}</div>`;
    document.querySelector('.score').textContent = S.score+'分';
  } else {
    S.combo=0; S.wrong++; S.hearts--;
    sBad();
    document.getElementById('app').classList.add('shake');
    setTimeout(()=>document.getElementById('app').classList.remove('shake'),450);
    let rightText='';
    if(el){
      el.classList.add('wrong');
      const opts=document.querySelectorAll('.opt');
      // 找到显示位置上正确答案对应的按钮
      const ai = S.optOrder.indexOf(q.a);
      if(opts[ai]) opts[ai].classList.add('correct');
      opts.forEach((o,idx)=>{ if(idx!==ai && o!==el) o.classList.add('dim'); });
      rightText = `正确答案：<b>${q.opts[q.a]}</b><br>`;
    } else {
      rightText = `参考答案：<b>${q.a}</b><br>你的答案：${data}<br>`;
    }
    fb.innerHTML = `<div class="feedback bad">❌ <b>答错了 Ой!</b> ${S.hearts>0?`失去一颗 ❤️（剩 ${S.hearts} 颗）`:'❤️ 已用完！'}<br>${rightText}💡 ${q.ex}</div>`;
    document.querySelector('.hearts').innerHTML = `${'❤️'.repeat(Math.max(0,S.hearts))}<span class="lost">${'❤️'.repeat(Math.max(0,3-S.hearts))}</span>`;
  }
  const btn = document.querySelector('#checkBtn');
  if(btn){ btn.textContent='下一题 →'; btn.onclick=nextQ; }
  else {
    setTimeout(()=>{ const nb=document.createElement('button'); nb.className='btn btn-next'; nb.textContent='下一题 →'; nb.onclick=nextQ; document.getElementById('fb').after(nb); window.scrollTo(0,document.body.scrollHeight); },700);
  }
}

function nextQ(){
  const l = LEVELS[S.level];
  if(S.hearts<=0){ failScreen(); return; }
  S.qi++;
  if(S.qi >= l.qs.length){ levelDone(); } else { renderQ(); }
}

function failScreen(){
  S.score -= S.levelScore; // 惩罚：本关得分清零
  $app.innerHTML = `
  <div class="screen center">
    <div class="big-emoji">💔</div>
    <h1 class="title" style="font-size:26px">红心用完了！</h1>
    <div class="subtitle">Сердечки закончились!<br>惩罚：本关得分清零（-${S.levelScore}分），重新挑战本关。<br>别灰心，复习一下课文再来！💪</div>
    <div style="width:100%;max-width:320px">
      <button class="btn btn-main" onclick="startLevel(${S.level})">🔁 重闯本关<span class="ru2">Пройти уровень заново</span></button>
      <button class="btn btn-sub" onclick="home()">← 返回首页 · На главную</button>
    </div>
  </div>`;
  sBad();
}

function levelDone(){
  const l = LEVELS[S.level];
  const acc = S.correct/l.qs.length;
  const stars = acc>=0.999?3 : acc>=0.8?2 : 1;
  if(stars > (S.stars[S.level]||0)) S.stars[S.level]=stars;
  localStorage.setItem('hanyu_game_v1', JSON.stringify({stars:S.stars,name:saved.name}));
  sStar();
  const isLast = S.level===LEVELS.length-1;
  $app.innerHTML = `
  <div class="screen center">
    <div class="big-emoji">${stars===3?'🎉':stars===2?'👏':'💪'}</div>
    <h1 class="title" style="font-size:26px">本关通关！</h1>
    <div class="stars">${'⭐'.repeat(stars)}<span class="off">${'⭐'.repeat(3-stars)}</span></div>
    <div class="subtitle">${stars===3?'全对！太厉害了！Идеально!':stars===2?'很棒！差一点点就全对啦！':'通关成功！再复习一下会更棒！'}</div>
    <div class="card" style="width:100%;max-width:320px">
      <div class="stat-row" style="margin:0">
        <div class="stat-box"><div class="stat-num">${S.score}</div><div class="stat-label">总分（очки）</div></div>
        <div class="stat-box"><div class="stat-num">${S.correct}/${l.qs.length}</div><div class="stat-label">正确率</div></div>
        <div class="stat-box"><div class="stat-num">${stars}/3</div><div class="stat-label">星级（звёзды）</div></div>
      </div>
    </div>
    <div style="width:100%;max-width:320px;margin-top:16px">
      ${isLast?`<button class="btn btn-main" onclick="finalScreen()">🏅 领取毕业证书<span class="ru2">Получить сертификат</span></button>`:`<button class="btn btn-main" onclick="levelIntro(${S.level+1})">▶ 下一关<span class="ru2">Следующий уровень</span></button>`}
      <button class="btn btn-sub" onclick="home()">🏠 返回首页 · На главную</button>
    </div>
  </div>`;
}

function finalScreen(){
  const total = Object.values(S.stars).reduce((a,b)=>a+b,0);
  $app.innerHTML = `
  <div class="screen">
    <div class="topbar">
      <button class="quit" onclick="home()">←</button>
      <span style="font-weight:800;font-size:18px">🏅 毕业证书 · Сертификат</span>
      <span style="width:26px"></span>
    </div>
    <div style="background:rgba(255,255,255,.15);border-radius:14px;padding:12px 14px;margin-bottom:14px">
      <div style="color:#fff;font-size:12.5px;margin-bottom:8px">✏️ 输入你的名字，会印在证书上 / Введи имя — оно будет на сертификате</div>
      <input class="name-input" id="nameInput" placeholder="你的名字 / твоё имя" value="${saved.name||''}" maxlength="14">

    <div style="text-align:center;color:#fff;font-size:12.5px;line-height:1.7;margin-top:14px;opacity:.92">

function renderCert(){
  const total = Object.values(S.stars).reduce((a,b)=>a+b,0);
  const done = LEVELS.filter((l,i)=>S.stars[i]>0).length;
  const name = (saved.name||'').trim() || '小汉语学习者';
  drawCert(name, total, S.score, done);
  const c=document.getElementById('certCanvas');
  if(c) document.getElementById('certImg').src = c.toDataURL('image/png');
}

/* ===== 生成证书卡片（1080×1620 PNG） ===== */
function drawCert(name, total, score, done){
  const c=document.getElementById('certCanvas'); if(!c) return;
  const W=1080, H=1620; c.width=W; c.height=H;
  const x=c.getContext('2d');
  const FONT='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Heiti SC",sans-serif';
  const f=(s,w)=>`${w||'normal'} ${s}px ${FONT}`;
  const cx=W/2;
  const rr=(l,t,w,h,r)=>{ x.beginPath(); x.moveTo(l+r,t); x.arcTo(l+w,t,l+w,t+h,r); x.arcTo(l+w,t+h,l,t+h,r); x.arcTo(l,t+h,l,t,r); x.arcTo(l,t,l+w,t,r); x.closePath(); };

  // 背景
  const bg=x.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#fdf7ea'); bg.addColorStop(.45,'#fffdf8'); bg.addColorStop(1,'#f9edd6');
  x.fillStyle=bg; x.fillRect(0,0,W,H);

  // 四角光晕
  const blob=(px,py,r,col)=>{ const g=x.createRadialGradient(px,py,0,px,py,r); g.addColorStop(0,col); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=g; x.beginPath(); x.arc(px,py,r,0,Math.PI*2); x.fill(); };
  blob(80,110,340,'rgba(124,92,214,.20)');
  blob(1010,250,330,'rgba(255,170,110,.26)');
  blob(990,1490,340,'rgba(90,180,240,.18)');
  blob(70,1430,320,'rgba(255,130,170,.20)');

  // 金色双边框
  x.fillStyle='rgba(255,255,255,.55)'; rr(36,36,W-72,H-72,48); x.fill();
  x.strokeStyle='#e2bf6a'; x.lineWidth=9; rr(36,36,W-72,H-72,48); x.stroke();
  x.strokeStyle='rgba(226,191,106,.5)'; x.lineWidth=2.5; rr(64,64,W-128,H-128,34); x.stroke();
  [[100,100],[W-100,100],[100,H-100],[W-100,H-100]].forEach(p=>{ x.fillStyle='#e2bf6a'; x.beginPath(); x.arc(p[0],p[1],7,0,7); x.fill(); });

  // 标题区
  x.textAlign='center'; x.textBaseline='alphabetic';
  x.fillStyle='#b08d55'; x.font=f(29); x.fillText('预科汉语强化教程 · 第一至四课',cx,152);
  x.fillStyle='#6a4bd0'; x.font=f(88,'bold'); x.fillText('汉语大闯关',cx,262);
  x.fillStyle='#b08d55'; x.font=f(30); x.fillText('毕 业 证 书   ·   С Е Р Т И Ф И К А Т',cx,320);
  x.strokeStyle='rgba(226,191,106,.8)'; x.lineWidth=3;
  x.beginPath(); x.moveTo(cx-170,356); x.lineTo(cx+170,356); x.stroke();
  x.fillStyle='#e2bf6a'; x.beginPath(); x.arc(cx,356,6,0,7); x.fill();

  // 熊猫头像（圆形裁剪，用图片绘制）
  const pd=190, pcy=458;
  x.save();
  x.beginPath(); x.arc(cx,pcy,pd/2,0,Math.PI*2); x.closePath();
  x.fillStyle='#fffdf6'; x.fill(); x.clip();
  if(pandaImg.complete && pandaImg.naturalWidth){
    const sc=Math.max(pd/pandaImg.naturalWidth, pd/pandaImg.naturalHeight)*1.22;
    const dw=pandaImg.naturalWidth*sc, dh=pandaImg.naturalHeight*sc;
    x.drawImage(pandaImg, cx-dw/2, pcy-dh/2, dw, dh);
  } else {
    x.textBaseline='middle'; x.font=f(118); x.fillStyle='#333'; x.fillText('🐼',cx,pcy); x.textBaseline='alphabetic';
    pandaImg.onload=()=>{ if(document.getElementById('certCanvas')) drawCert(name,total,score,done); };
  }
  x.restore();
  x.strokeStyle='#e2bf6a'; x.lineWidth=5; x.beginPath(); x.arc(cx,pcy,pd/2,0,Math.PI*2); x.stroke();
  x.strokeStyle='rgba(255,255,255,.92)'; x.lineWidth=2; x.beginPath(); x.arc(cx,pcy,pd/2-7,0,Math.PI*2); x.stroke();

  // 证明文字
  x.fillStyle='#9a8f7e'; x.font=f(27); x.fillText('兹证明 / Настоящим подтверждается, что',cx,582);

  // 姓名
  const nm = name.length>10 ? name.slice(0,10)+'…' : name;
  let nf = 94; if(nm.length>6) nf=74; if(nm.length>8) nf=62;
  x.font=f(nf,'bold'); x.fillStyle='#d4467a'; x.fillText(nm,cx,688);
  const nw = Math.min(W-280, x.measureText(nm).width+100);
  x.strokeStyle='rgba(212,70,122,.35)'; x.lineWidth=4;
  x.beginPath(); x.moveTo(cx-nw/2,714); x.lineTo(cx+nw/2,714); x.stroke();

  // 星
  x.fillStyle='#8a7f9a'; x.font=f(26); x.fillText('完成了「汉语大闯关」全部关卡',cx,770);
  const sw=46, gp=4, s0=cx-(15*(sw+gp))/2;
  x.font=f(38,'bold'); x.textAlign='left';
  for(let i=0;i<15;i++){ x.fillStyle = i<total ? '#f0b429' : '#e6dcc8'; x.fillText('★', s0+i*(sw+gp), 838); }
  x.textAlign='center'; x.fillStyle='#b08d55'; x.font=f(28,'bold'); x.fillText(total+' / 15  ★',cx,888);

  // 数据块
  const boxes=[['总分 / ОЧКИ', score+' 分'],['星级 / ЗВЁЗДЫ', total+' / 15'],['通关 / УРОВНИ', done+' / '+LEVELS.length]];
  const bw=286, bh=132, gb=26, tot=bw*3+gb*2, b0=cx-tot/2;
  boxes.forEach((b,i)=>{
    const bx=b0+i*(bw+gb), by=930;
    x.fillStyle='#fff'; rr(bx,by,bw,bh,22); x.fill();
    x.strokeStyle='rgba(124,92,214,.2)'; x.lineWidth=2; rr(bx,by,bw,bh,22); x.stroke();
    x.fillStyle='#a99fb8'; x.font=f(23); x.fillText(b[0], bx+bw/2, by+50);
    x.fillStyle='#6a4bd0'; x.font=f(40,'bold'); x.fillText(b[1], bx+bw/2, by+104);
  });

  // 称号横幅（中俄分两行，自动缩字，避免超出边框）
  const r=rankFor(total);
  const bandTop=1092, bandH=152;
  const tg=x.createLinearGradient(cx-390,0,cx+390,0);
  tg.addColorStop(0,'#7c5cd6'); tg.addColorStop(1,'#5b8def');
  x.fillStyle=tg; rr(cx-390,bandTop,780,bandH,28); x.fill();
  x.textAlign='center';
  let tf=44; x.font=f(tf,'bold');
  while(x.measureText(r.t).width>700 && tf>22){ tf-=2; x.font=f(tf,'bold'); }
  x.fillStyle='#fff'; x.fillText(r.t, cx, bandTop+62);
  let rf=30; x.font=f(rf);
  while(x.measureText(r.ru).width>700 && rf>16){ rf-=1; x.font=f(rf); }
  x.fillStyle='rgba(255,255,255,.94)'; x.fillText(r.ru, cx, bandTop+116);

  // 课程信息
  x.fillStyle='#8a7f9a'; x.font=f(27);
  x.fillText('第1课 你好   ·   第2课 这是你的手机吗',cx,1296);
  x.fillText('第3课 你家有几口人   ·   第4课 电影开始了吗',cx,1338);

  // 印章
  x.save(); x.translate(862,1444); x.rotate(-8*Math.PI/180);
  x.fillStyle='#cf4a42'; rr(-78,-78,156,156,18); x.fill();
  x.strokeStyle='rgba(255,255,255,.8)'; x.lineWidth=5; rr(-66,-66,132,132,12); x.stroke();
  x.fillStyle='#fff'; x.textAlign='center'; x.font=f(40,'bold');
  x.fillText('汉语',0,-8); x.fillText('通关',0,46);
  x.restore();

  // 日期与签名
  const d=new Date();
  x.textAlign='left'; x.fillStyle='#a89b85'; x.font=f(29);
  x.fillText(d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日',150,1440);
  x.strokeStyle='rgba(168,155,133,.55)'; x.lineWidth=2;
  x.beginPath(); x.moveTo(150,1474); x.lineTo(430,1474); x.stroke();
  x.fillStyle='#b6ab97'; x.font=f(23); x.fillText('教师签名 / подпись',150,1514);
}

function saveCert(){
  const c=document.getElementById('certCanvas'); if(!c) return;
  try{
    const url=c.toDataURL('image/png');
    const a=document.createElement('a'); a.href=url; a.download='汉语闯关证书.png';
    document.body.appendChild(a); a.click(); a.remove();
    toast('图片已生成，若没弹出保存，请长按证书图片');
  }catch(e){ toast('请长按证书图片保存到相册'); }
}

async function shareCert(){
  const c=document.getElementById('certCanvas');
  const total=Object.values(S.stars).reduce((a,b)=>a+b,0);
  const r=rankFor(total);
  const nm=(saved.name||'').trim()||'我';
  const txt=`🏆 ${nm} 完成了【汉语大闯关】第1–4课全部关卡！\n⭐ 总星数：${total}/15\n🎯 总分：${S.score} 分\n🏅 称号：${r.t}\n你也来挑战一下吧！`;
  try{
    if(c && navigator.canShare && navigator.share){
      const blob=await new Promise(res=>c.toBlob(res,'image/png'));
      const file=new File([blob],'cert.png',{type:'image/png'});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],text:txt}); return; }
    }
    if(navigator.share){ await navigator.share({text:txt}); return; }
  }catch(e){}
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('成绩已复制，去粘贴给同学 📋')).catch(()=>copyFallback(txt));
  } else copyFallback(txt);
}

function copyFallback(txt){
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity=0;
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('成绩已复制 📋'); }catch(e){ toast('复制失败，请截图分享'); }
  ta.remove();
}

/* 启动 */
if(window.speechSynthesis) speechSynthesis.getVoices();
home();
